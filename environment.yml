# =============================================================================
# CONDA ENVIRONMENT (GPU version for RTX 3060)
# Tested with: Python 3.10, CUDA 12.x, RAPIDS 24.10
# Install: conda env create -f environment.yml
# Activate: conda activate anomaly_ssl
# =============================================================================
name: anomaly_ssl

channels:
  - rapidsai
  - conda-forge
  - nvidia
  - pytorch
  - defaults

dependencies:
  # Python 3.10 (3.11 has dependency conflicts with RAPIDS+tokenizers)
  - python=3.10

  # CUDA toolkit 12.4 (matches RTX 3060)
  - nvidia/label/cuda-12.4.0::cuda-cudart
  - nvidia/label/cuda-12.4.0::cuda-nvcc

  # PyTorch 2.4 with CUDA 12.4 (stable)
  - pytorch::pytorch=2.4.1
  - pytorch::pytorch-cuda=12.4
  - pytorch::torchvision=0.19.1
  - pytorch::torchaudio=2.4.1

  # RAPIDS 24.10 (CUDA 12 compatible)
  - rapidsai::cuml=24.10.00
  - rapidsai::cudf=24.10.00
  - conda-forge::cupy=13.0.0

  # FAISS GPU 1.8.0 (CUDA 12 support)
  - conda-forge::faiss-gpu=1.8.0

  # Core scientific stack
  - conda-forge::numpy=1.26
  - conda-forge::pandas=2.2
  - conda-forge::scipy=1.13
  - conda-forge::scikit-learn=1.5
  - conda-forge::matplotlib=3.9
  - conda-forge::seaborn=0.13
  - conda-forge::tqdm=4.66
  - conda-forge::joblib=1.4
  - conda-forge::pyyaml=6.0
  - conda-forge::python-dotenv=1.0
  - conda-forge::pillow=10.4

  # Hugging Face (use latest, conda resolves)
  - conda-forge::transformers
  - conda-forge::huggingface_hub
  - conda-forge::tokenizers
  - conda-forge::safetensors

  # Pip extras
  - pip
  - pip:
    - regex
    - requests
    - certifi

# =============================================================================
# VERIFICATION (run after install):
# =============================================================================
#   conda activate anomaly_ssl
#   nvidia-smi
#   python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
#   python -c "import faiss; print('FAISS GPUs:', faiss.get_num_gpus())"
#   python -c "import cuml; print('cuML:', cuml.__version__)"
