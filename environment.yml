# =============================================================================
# CONDA ENVIRONMENT (GPU version for RTX 3060)
# Tested with: CUDA 12.x, Python 3.11, RAPIDS 24.10
# Install: conda env create -f environment.yml
# Activate: conda activate anomaly_ssl
# =============================================================================
name: anomaly_ssl

channels:
  - rapidsai
  - conda-forge
  - nvidia
  - pytorch
  - defaults

dependencies:
  # Python version (RAPIDS 24.10 supports 3.10 and 3.11)
  - python=3.11

  # CUDA toolkit (required for cuML/cuDF/faiss-gpu)
  - nvidia::cuda-cudart=12.4
  - nvidia::cuda-version=12.4
  - nvidia::cuda-nvcc=12.4

  # GPU acceleration - RAPIDS 24.10 (supports CUDA 12.4)
  - rapidsai::cuml=24.10
  - rapidsai::cudf=24.10
  - rapidsai::rapids=24.10
  - conda-forge::cupy=13.0
  - conda-forge::faiss-gpu=1.8.0

  # PyTorch 2.4 with CUDA 12.1 (stable, RTX 3060 compatible)
  - pytorch::pytorch=2.4
  - pytorch::pytorch-cuda=12.4
  - pytorch::torchvision=0.19
  - pytorch::torchaudio=2.4

  # Core scientific stack (versions compatible with cuML 24.10)
  - conda-forge::numpy=1.26
  - conda-forge::pandas=2.2
  - conda-forge::scipy=1.13
  - conda-forge::scikit-learn=1.5
  - conda-forge::matplotlib=3.9
  - conda-forge::seaborn=0.13
  - conda-forge::tqdm=4.66
  - conda-forge::joblib=1.4
  - conda-forge::pyyaml=6.0
  - conda-forge::python-dotenv=1.0
  - conda-forge::pillow=10.4

  # Hugging Face (for BERT)
  - conda-forge::transformers=4.44
  - conda-forge::huggingface_hub=0.25
  - conda-forge::tokenizers=0.20
  - conda-forge::safetensors=0.4

  # Pip-installed extras
  - pip
  - pip:
    - regex==2024.11.6
    - requests==2.32.3
    - certifi==2024.8.30

# =============================================================================
# VERIFICATION (run after install):
# =============================================================================
#   conda activate anomaly_ssl
#   nvidia-smi
#   python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0))"
#   python -c "import faiss; print('FAISS GPUs:', faiss.get_num_gpus())"
#   python -c "import cuml; print('cuML:', cuml.__version__)"
#   python -c "import cudf; print('cuDF:', cudf.__version__)"
